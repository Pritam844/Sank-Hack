name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Chefmate-AI.apk
          ls -lh ./Chefmate-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chefmate-AI-apk
          path: ./Chefmate-AI.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: Chefmate AI v1.0.0 APK
          body: |
            Download and install Chefmate AI APK directly on your Android phone!
          files: ./Chefmate-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
